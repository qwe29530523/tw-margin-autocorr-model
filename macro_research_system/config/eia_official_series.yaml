prices_benchmark_context:
  - series_id: RWTC
    route: petroleum/pri/spt
    series_name: Cushing, OK WTI Spot Price FOB
    group: prices_benchmark_context
    frequency_hint: daily
    unit_hint: dollars per barrel
    seasonal_adjustment_hint: not seasonally adjusted
    source_name: EIA
    source_type: official_public_energy
    feature_role: wti_spot_benchmark_context
    active: true
    not_usable_for:
      - CL individual contract-month settlement
      - WTI M1/M2/M3 futures curve
  - series_id: EER_EPMRU_PF4_RGC_DPG
    route: petroleum/pri/spt
    series_name: U.S. Gulf Coast Conventional Gasoline Spot Price
    group: prices_benchmark_context
    frequency_hint: daily
    unit_hint: dollars per gallon
    seasonal_adjustment_hint: not seasonally adjusted
    source_name: EIA
    source_type: official_public_energy
    feature_role: gasoline_spot_benchmark_context
    active: true
    not_usable_for:
      - CL individual contract-month settlement
      - WTI M1/M2/M3 futures curve
  - series_id: EER_EPD2DXL0_PF4_RGC_DPG
    route: petroleum/pri/spt
    series_name: U.S. Gulf Coast Ultra-Low Sulfur No. 2 Diesel Spot Price
    group: prices_benchmark_context
